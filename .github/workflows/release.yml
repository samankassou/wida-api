name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    name: Publish GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Verify released commit belongs to main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Extract version-matched changelog
        run: node scripts/release-notes.mjs "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            # Only an already published release completes this step on a retry.
            jq -e '.isDraft == false' "$RUNNER_TEMP/existing-release.json" > /dev/null
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Wida API $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
      - name: Mark release PR as published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_commit=$(git rev-parse HEAD)
          gh pr list --repo "$GITHUB_REPOSITORY" --state merged \
            --label "autorelease: pending" --limit 100 --json number,mergeCommit \
            --jq '.[] | [.number, .mergeCommit.oid] | @tsv' > "$RUNNER_TEMP/release-prs.tsv"
          while IFS=$'\t' read -r pr commit; do
            if [ -n "$commit" ] && git merge-base --is-ancestor "$commit" "$release_commit"; then
              gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --remove-label "autorelease: pending"
            fi
          done < "$RUNNER_TEMP/release-prs.tsv"

  deploy:
    name: Deploy published release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify published release is current main
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,tagName \
            --jq 'select(.isDraft == false and .isPrerelease == false) | .tagName' \
            | grep -Fx -- "$RELEASE_TAG"
          # A stale release retry must not roll production back.
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Request Render deployment of the tagged commit
        shell: bash
        run: |
          set -euo pipefail
          : "${RENDER_DEPLOY_HOOK_URL:?Add the RENDER_DEPLOY_HOOK_URL repository secret}"
          release_commit=$(git rev-parse HEAD)
          curl --fail --silent --show-error --max-time 60 \
            --get --request POST --data-urlencode "ref=$release_commit" \
            "$RENDER_DEPLOY_HOOK_URL" --output "$RUNNER_TEMP/render-deploy.json"
          echo "Render accepted deployment of $RELEASE_TAG ($release_commit). Verify completion and commit SHA in Render before claiming the release is live." >> "$GITHUB_STEP_SUMMARY"
