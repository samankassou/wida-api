name: CI

on:
  pull_request:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: API checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check release tooling
        run: |
          node --test tests/*.test.mjs
          node scripts/check-release.mjs
      - name: Restore
        run: dotnet restore Wida.slnx
      - name: Build
        run: dotnet build Wida.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test Wida.Tests/Wida.Tests.csproj --configuration Release --no-build --no-restore
      - name: Publish API
        run: dotnet publish Wida.Api/Wida.Api.csproj --configuration Release --no-build --no-restore --output "$RUNNER_TEMP/wida-api"
