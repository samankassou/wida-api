# Example for RabbitMQ installed as a native service on the SAME server as Wida.
# Merge into /etc/rabbitmq/rabbitmq.conf; do not overwrite an existing broker config.
# If Wida connects from another server, use the appropriate private listener/TLS settings.
listeners.tcp.default = 127.0.0.1:5672

# The worker can track an Azure operation for up to 20 hours.
consumer_timeout = 86400000

# Optional, only when the rabbitmq_management plugin is enabled:
# management.tcp.ip = 127.0.0.1
# management.tcp.port = 15672
